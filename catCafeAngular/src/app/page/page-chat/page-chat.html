  <div class="carte-chat">

    <div class="image-chat">
  <img
    [src]="image()|| '/images/chats/' + chat().id + '.webp'"
    [alt]="'Photo de ' + chat().nom">
</div>
    <!-- Informations du chat -->

    <div class="informations">

      <h1>{{ chat().nom }}</h1>

      <p><strong>Race :</strong> {{ chat()['race'] }}</p>

      <p><strong>Âge :</strong> {{ formatAge(chat().age) }}</p>

      <p><strong>Sexe :</strong> {{ chat()['sexe'] }}</p>

      <p><strong>Caractère :</strong> {{ chat()['caractère'] }}</p>

    </div>

    <!-- Statut d'adoption -->

    <div class="boutons-adoption">
       <span *ngIf="!chat()['adopted']" class="badge adoptable">
    Disponible à l'adoption
       </span>

     <!-- Chat en cours d'adoption -->
        <span *ngIf="chat()['adopted']" class="badge adoption">
            En cours d'adoption
        </span>

  <!-- Bouton Adopter -->
        <button
          class="btn"
          type="button"
          [disabled]="chat()['adopted']"
          (click)="adopterChat(chat)">
          Adopter
        </button>
        
    </div>

  </div>
