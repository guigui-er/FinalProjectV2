<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Chat Perché — Bar à chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   MAQUETTE STATIQUE — Bar à chats « Le Chat Perché »
   Direction artistique : aquarelle / cinéma d'animation japonais
   (bois chaud, lumière dorée, personnages ronds aux joues rosées)
   Tout est en vanilla JS : à porter ensuite en composants Angular
   (voir la note en bas du fichier).
   =========================================================== */

:root{
  --encre:        #4e3b2c;   /* contour chaud, jamais de noir pur */
  --encre-doux:   #7b6350;
  --creme:        #fdf4e0;
  --papier:       #f7e9ca;
  --mur:          #efdcb6;
  --mur-ombre:    #e2c796;
  --bois:         #c99a62;
  --bois-fonce:   #a97745;
  --bois-clair:   #ddb782;
  --terre:        #c9664a;
  --vert:         #6f9e59;
  --vert-fonce:   #4b7441;
  --vert-clair:   #a8cb7e;
  --ciel:         #bfe4e2;
  --or:           #f8e3a6;
  --rose:         #e79a93;
  --ombre:        rgba(94,67,45,.22);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Nunito',"Segoe UI",system-ui,sans-serif;
  color:var(--encre);
  background:
    radial-gradient(900px 500px at 15% 0%, #fbeccd 0%, transparent 60%),
    radial-gradient(700px 500px at 95% 100%, #e7d7b4 0%, transparent 55%),
    #f1dfbe;
  min-height:100%;
}

/* ---------- Mise en page ---------- */
.app{
  max-width:1480px;margin:0 auto;padding:18px 22px 40px;
  display:flex;flex-direction:column;gap:16px;
}
.entete{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.enseigne h1{
  font-family:'Caveat',cursive;font-size:44px;line-height:1;margin:0;
  color:#4a3627;letter-spacing:.5px;
}
.enseigne p{margin:4px 0 0;font-size:14px;color:var(--encre-doux)}
.compteurs{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.compteur{
  background:var(--creme);border:2px solid #e3cda4;border-radius:16px;
  padding:8px 14px;min-width:104px;box-shadow:0 3px 0 #e0c9a0;
}
.compteur b{display:block;font-size:21px;font-weight:800}
.compteur span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--encre-doux)}

.scene-et-panneau{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:18px;align-items:start}
@media (max-width:1080px){.scene-et-panneau{grid-template-columns:1fr}}

/* ---------- Le salon ---------- */
.salon{
  position:relative;width:100%;aspect-ratio:1000/660;
  border-radius:22px;overflow:hidden;
  border:3px solid #cdae84;
  box-shadow:0 18px 40px -16px rgba(80,56,34,.55), inset 0 0 0 2px rgba(255,255,255,.35);
  cursor:default;
}
.salon svg.decor{position:absolute;inset:0;width:100%;height:100%;display:block}

/* rayons de lumière + poussières */
.rayon{
  position:absolute;top:-6%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(255,246,212,.75),rgba(255,240,196,.08) 72%,transparent);
  filter:blur(7px);transform:skewX(-15deg);border-radius:40%;
  animation:respire 11s ease-in-out infinite;
}
@keyframes respire{0%,100%{opacity:.55}50%{opacity:.95}}
.poussiere{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,#fff9dd,rgba(255,249,221,0));
  pointer-events:none;animation:flotte linear infinite;
}
@keyframes flotte{
  0%{transform:translate(0,0);opacity:0}
  15%{opacity:.9}
  100%{transform:translate(26px,-120px);opacity:0}
}

/* ---------- Entités cliquables ---------- */
.ent{position:absolute;transform:translate(-50%,-100%);pointer-events:auto}
.ent.cliquable{cursor:pointer}
.ent svg{display:block;overflow:visible}
.ent.chat .corps{transform-origin:50% 100%}
.ent.cliquable:hover svg{filter:drop-shadow(0 0 7px rgba(255,236,170,.95))}
.ent.actif svg{filter:drop-shadow(0 0 10px rgba(255,214,120,1))}

.etiquette{
  position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);
  background:var(--creme);border:2px solid #e0c79c;border-radius:12px;
  padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;
  opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;
  box-shadow:0 3px 0 #e0c79c;
}
.ent:hover .etiquette{opacity:1;transform:translate(-50%,-100%) translateY(-4px)}

/* le petit balancement « animé à la main » */
.respire-doux{animation:balance 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes balance{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-1.5px)}}
.marche{animation:sautille .5s ease-in-out infinite}
@keyframes sautille{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.queue{animation:queueWag 1.6s ease-in-out infinite;transform-origin:88% 62%}
@keyframes queueWag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(12deg)}}
.zzz{animation:zzzMonte 3s ease-in-out infinite}
@keyframes zzzMonte{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:.95}100%{opacity:0;transform:translate(9px,-20px) scale(1.1)}}
.vapeur{animation:vapeurMonte 3.6s ease-in-out infinite}
@keyframes vapeurMonte{0%{opacity:0;transform:translateY(2px) scaleX(.8)}40%{opacity:.75}100%{opacity:0;transform:translateY(-14px) scaleX(1.25)}}

/* ---------- Panneau latéral (papier) ---------- */
.panneau{
  background:
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(130,100,70,.07) 27px 28px),
    var(--creme);
  border:3px solid #e0c79c;border-radius:20px;padding:18px;
  box-shadow:0 12px 26px -14px rgba(80,56,34,.5);
  position:relative;min-height:320px;
}
.panneau::before{ /* ruban adhésif */
  content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:92px;height:22px;background:rgba(246,224,170,.85);border:1px solid rgba(190,160,110,.5);
  border-radius:3px;
}
.panneau h2{font-family:'Caveat',cursive;font-size:30px;margin:4px 0 2px}
.panneau .sous{font-size:12.5px;color:var(--encre-doux);margin:0 0 12px}
.vide{text-align:center;padding:36px 8px;color:var(--encre-doux);font-size:14px}
.vide .patte{font-size:40px;display:block;margin-bottom:8px;opacity:.65}

.fiche-haut{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.portrait{
  width:88px;height:88px;flex:0 0 auto;border-radius:50%;
  background:linear-gradient(160deg,#fff6de,#f0dcb4);
  border:3px solid #e3cba1;display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 -6px 12px rgba(190,160,110,.25);
}
.portrait svg{width:auto;height:auto;max-width:84px;max-height:84px}
.badge{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;
  background:#e6f0d8;color:#466b38;border:1.5px solid #c2d9ab;
}
.badge.rouge{background:#fbe2da;color:#a44b32;border-color:#eec3b5}
.badge.bleu{background:#dcecf2;color:#3d6a7d;border-color:#b9d6e1}

dl.infos{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
dl.infos dt{color:var(--encre-doux);font-weight:600}
dl.infos dd{margin:0;font-weight:700}
.humeur{
  margin-top:12px;padding:10px 12px;border-radius:14px;
  background:#f6e7c6;border:2px dashed #dcc096;font-family:'Caveat',cursive;font-size:18px;
}

/* commande */
.bloc{margin-top:14px}
.bloc h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--encre-doux);margin:0 0 8px}
.choix-tables{display:flex;gap:7px;flex-wrap:wrap}
.pastille{
  border:2px solid #e0c79c;background:#fff8e7;border-radius:12px;padding:6px 10px;
  font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:var(--encre);
  box-shadow:0 2px 0 #e0c79c;
}
.pastille:hover{background:#fdeec6}
.pastille.on{background:var(--terre);color:#fff8e7;border-color:#a84f36;box-shadow:0 2px 0 #a84f36}
.pastille:disabled{opacity:.42;cursor:not-allowed}

.carte{max-height:206px;overflow:auto;padding-right:4px;margin:0}
.carte .cat{font-family:'Caveat',cursive;font-size:19px;margin:8px 0 2px;color:#8a6a45}
.ligne{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted #ddc49c}
.ligne .nom{flex:1;font-size:13.5px;font-weight:600}
.ligne .prix{font-size:12.5px;color:var(--encre-doux);font-variant-numeric:tabular-nums}
.qte{display:flex;align-items:center;gap:5px}
.qte button{
  width:24px;height:24px;border-radius:8px;border:2px solid #e0c79c;background:#fff8e7;
  font-weight:800;cursor:pointer;line-height:1;color:var(--encre);font-family:inherit;
}
.qte button:hover{background:#fdeec6}
.qte span{min-width:16px;text-align:center;font-weight:800;font-size:13px}

.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:15px}
.total b{font-size:23px;font-family:'Caveat',cursive}
.btn{
  width:100%;margin-top:10px;padding:12px;border-radius:14px;border:none;cursor:pointer;
  background:var(--terre);color:#fff6e2;font-weight:800;font-size:15px;font-family:inherit;
  box-shadow:0 4px 0 #a84f36;transition:transform .08s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a84f36}
.btn:disabled{background:#d9c6a6;box-shadow:0 4px 0 #c3ae8c;cursor:not-allowed;color:#8d7a5e}

/* commandes en cours */
.ardoise{
  margin-top:18px;background:#4a5d4a;border:3px solid #6b4f33;border-radius:18px;
  padding:14px 16px;color:#eef3e4;box-shadow:inset 0 0 26px rgba(0,0,0,.33);
}
.ardoise h2{font-family:'Caveat',cursive;font-size:26px;margin:0 0 8px;color:#f6e6bd}
.ardoise .vide2{font-size:13px;opacity:.72}
.cmd{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(246,230,189,.3);font-size:13px}
.cmd .t{font-weight:800;background:rgba(246,230,189,.17);border-radius:8px;padding:2px 7px}
.cmd .d{flex:1;opacity:.9}
.cmd .s{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:999px;background:#c9814a;color:#fff6e2}
.cmd .s.servie{background:#7fa05c}

/* légende */
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--encre-doux);padding:0 4px}
.legende i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);
  background:var(--creme);border:3px solid #e0c79c;border-radius:16px;
  padding:12px 20px;font-weight:700;box-shadow:0 12px 24px -10px rgba(80,56,34,.6);
  transition:transform .35s cubic-bezier(.2,1.5,.4,1);z-index:60;display:flex;gap:9px;align-items:center;
}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <header class="entete">
    <div class="enseigne">
      <h1>Le Chat Perché</h1>
      <p>Salon de thé &amp; refuge félin — 12 rue des Glycines</p>
    </div>
    <div class="compteurs">

  <div class="scene-et-panneau">

        <div id="liste-cmd"><p class="vide2">Aucune commande. Clique sur un serveur pour en prendre une.</p></div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span>🐾</span><span id="toast-txt"></span></div>

/* ============================================================

const pc = (v, max) => (v / max * 100) + '%';

/* ============================================================
   2. DÉCOR  — un seul grand SVG peint « à la main »
   ============================================================ */

function decor(){
  const planches = [];
  for(let i=0;i<13;i++){
    const y = 252 + i*32;
    planches.push(`<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="rgba(120,84,48,.20)" stroke-width="2"/>`);
  }
  for(let i=0;i<22;i++){
    const x = (i*61 + (i%2?28:0)) % 1010, y0 = 252 + (i%13)*32;
    planches.push(`<line x1="${x}" y1="${y0}" x2="${x+3}" y2="${y0+32}" stroke="rgba(120,84,48,.14)" stroke-width="2"/>`);
  }

  const fenetre = (x,y,w,h) => `
    <g>
      <rect x="${x-7}" y="${y-7}" width="${w+14}" height="${h+14}" rx="${w/2+7}" fill="#b98f5c"/>
      <path d="M${x} ${y+h} L${x} ${y+w/2} A${w/2} ${w/2} 0 0 1 ${x+w} ${y+w/2} L${x+w} ${y+h} Z" fill="url(#jardin)"/>

/* ------------------------------------------------------------------
   PERSONNAGES — chara-design anime
   Repère interne : 60 × 96 unités, ≈ 5,5 têtes.
   Tête y 2→20, cou 20→24, épaules 25, taille 40, hanches 48, pieds 92.
   Rendu cel : aplat + une ombre franche calculée, line art brun foncé,
   yeux larges à iris dégradé et double reflet, mèches pointues.
   ------------------------------------------------------------------ */

const ENCRE  = '#4a3328';        // line art
const LINE   = .62;              // épaisseur du trait

function teinte(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255-v)*k : v*(1+k))));
  return '#' + [f((n>>16)&255), f((n>>8)&255), f(n&255)].map(v => v.toString(16).padStart(2,'0')).join('');
}

/* membre « tube » : trait d'encre dessous, aplat par-dessus */
function membre(d, couleur, ep){
  return `<path d="${d}" fill="none" stroke="${ENCRE}" stroke-width="${ep + LINE*2}" stroke-linecap="round"/>
          <path d="${d}" fill="none" stroke="${couleur}" stroke-width="${ep}" stroke-linecap="round"/>`;
}

/* ---------------- chevelure : masse arrière + mèches pointues ---------------- */
function cheveux(p){
  const c   = p.cheveux;
  const cl  = teinte(c,  .30);                       // bande de lumière
  const co  = teinte(c, -.32);                       // creux
  const ink = `stroke="${ENCRE}" stroke-width="${LINE}" stroke-linejoin="round"`;

  // frange en dents : chaque pointe retombe devant le front
  const frange = `
    <path d="M30 .6 C37.4 .6 40.2 5 39.8 11.6 L38.2 8.4 L36.6 12.4 L34.8 7.8 L32.4 12.2 L30.6 7.4
             L28 12.4 L26.2 7.8 L24.2 12.6 L22.6 8.6 L20.6 11.8 C20 5 23 .6 30 .6 Z" fill="${c}" ${ink}/>`;
  const brillance = `
    <path d="M24.8 5 C27.3 3.3 32.3 2.9 35.6 4.4 L34.8 5.7 L32.2 4.9 L29.2 6 L26.8 5 Z" fill="${cl}" opacity=".9"/>`;

  switch(p.coiffe){
    case 'carre': return `
      <path d="M30 .4 C39 .4 41.4 6.4 41 13 L40.4 19.6 L38.6 23.4 L37.4 19 L37.6 13 C34.8 10.4 25.2 10.4 22.4 13
               L22.6 19 L21.4 23.4 L19.6 19.6 L19 13 C18.6 6.4 21 .4 30 .4 Z" fill="${c}" ${ink}/>
      ${frange}
      <path d="M20.8 11.8 C19.8 15.2 20 19.4 21.4 23.4 L22.6 18.4 L22.4 13 Z" fill="${co}"/>
      ${brillance}`;
    case 'chignon': return `
      <ellipse cx="30" cy="-2.8" rx="5.6" ry="4.2" fill="${c}" ${ink}/>
      <path d="M26 -5 C28.6 -6.4 32.6 -5.8 34.4 -3.6 C31.8 -4.8 28.4 -5.2 26 -5 Z" fill="${cl}"/>
      <path d="M30 .4 C38.6 .4 41 5.8 40.6 12.4 C39.6 9.2 38.4 7.4 37 6.4 C34 8.2 26 8.2 23 6.6
               C21.6 7.6 20.4 9.4 19.4 12.4 C19 5.8 21.4 .4 30 .4 Z" fill="${c}" ${ink}/>
      ${frange}
      <path d="M20.4 10.4 C19 15 19.6 20 21.2 24 L23 20.2 L22 13 Z" fill="${c}" ${ink}/>
      <path d="M39.6 10.4 C41 15 40.4 20 38.8 24 L37 20.2 L38 13 Z" fill="${co}" ${ink}/>
      ${brillance}`;
    case 'queue': return `
      <path d="M38.4 5.4 C46.4 7.6 49 17 45.2 26.6 L43.6 21.4 L42.2 25 L41.4 19.2 L39.6 22.2
               C40.4 15.6 39.4 10.6 36.8 7.8 Z" fill="${c}" ${ink}/>
      <path d="M40.4 9 C44.2 12.4 45.2 18.4 43.8 23.8 C44.2 18 42.8 13 40 10 Z" fill="${co}"/>
      <path d="M30 .4 C38.8 .4 41.2 5.6 40.6 12.4 C39.6 9.2 38.4 7.5 37 6.5 C34 8.4 26 8.4 23 6.8
               C21.6 7.8 20.3 9.6 19.4 12.4 C18.8 5.6 21.2 .4 30 .4 Z" fill="${c}" ${ink}/>
      ${frange}
      <path d="M21 11.4 C20 14.6 20.2 18 21.2 21 L22.6 17 L22.4 12.6 Z" fill="${c}" ${ink}/>
      ${brillance}`;
    default: return `
      ${frange}
      <path d="M21 11 C20.2 14.2 20.4 17.2 21.4 19.8 L22.8 15.6 L22.6 11.8 Z" fill="${c}" ${ink}/>
      <path d="M39 11 C39.8 14.2 39.6 17.2 38.6 19.8 L37.2 15.6 L37.4 11.8 Z" fill="${co}" ${ink}/>
      ${brillance}`;
  }
}

/* ---------------- visage : grands yeux anime ---------------- */
function oeil(cx, iris, sens, peau){
  const haut = teinte(iris, -.40), bas = teinte(iris, .38);
  const f = sens;                                   // 1 = œil gauche du spectateur
  const id  = 'o' + Math.round(cx*10) + (f > 0 ? 'g' : 'd');
  // contour supérieur : sert à la fois de bord de l'œil et de ligne de cils
  const haut_d = `M${cx - 2.15*f} 13.8 C${cx - 2.05*f} 11.1 ${cx - 1.2*f} 9.7 ${cx + .2*f} 9.7
                  C${cx + 1.6*f} 9.7 ${cx + 2.25*f} 11.3 ${cx + 2.25*f} 13.8`;
  const forme  = `${haut_d} C${cx + 2.25*f} 16 ${cx + 1.2*f} 16.9 ${cx - .1*f} 16.9
                  C${cx - 1.4*f} 16.9 ${cx - 2.15*f} 16 ${cx - 2.15*f} 13.8 Z`;
  return `
    <clipPath id="${id}"><path d="${forme}"/></clipPath>
    <path d="${forme}" fill="#fbf7f2"/>
    <g clip-path="url(#${id})">
      <ellipse cx="${cx}" cy="13.4" rx="1.85" ry="3.3" fill="${iris}"/>
      <ellipse cx="${cx}" cy="11.4" rx="1.85" ry="1.9" fill="${haut}"/>
      <ellipse cx="${cx}" cy="15.4" rx="1.5" ry="1.3" fill="${bas}"/>
      <ellipse cx="${cx}" cy="13.7" rx=".8" ry="1.8" fill="#241a18"/>
      <circle cx="${cx - .8*f}" cy="11.8" r="1.05" fill="#fff"/>
      <circle cx="${cx + .95*f}" cy="15.4" r=".48" fill="#fff" opacity=".9"/>
    </g>
    <path d="${haut_d}" fill="none" stroke="${ENCRE}" stroke-width="1.25" stroke-linecap="round"/>
    <path d="M${cx - 2.15*f} 13.8 L${cx - 3.2*f} 12.7" stroke="${ENCRE}" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M${cx - 1.2*f} 17.1 C${cx + .1*f} 17.5 ${cx + 1.3*f} 17.3 ${cx + 2*f} 16.6"
          fill="none" stroke="${teinte(peau,-.3)}" stroke-width=".5" stroke-linecap="round"/>`;
}

function visage(p){
  const iris  = p.yeux || '#6b4a33';
  const peauO = teinte(p.peau, -.12);

/* Table ronde en bois + chaises + tasses */
function tableSVG(t){
  const d = 54 + t.places * 9;              // diamètre du plateau
  const rx = d/2, ry = d/2 * 0.42;          // perspective légère
  const pad = 46;
  const w = d + pad*2, h = d + 70;
  const cx = w/2, cy = h/2;
  const chaises = [];
  for(let i=0;i<t.places;i++){
    const a = -Math.PI/2 + i * (2*Math.PI / t.places);
    const chx = cx + Math.cos(a) * (rx + 26);
    const chy = cy + Math.sin(a) * (ry + 20);
    chaises.push(`<g transform="translate(${chx},${chy})">
      <ellipse cx="0" cy="8" rx="15" ry="5" fill="rgba(94,67,45,.18)"/>
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#a97745"/>
      <ellipse cx="0" cy="-3" rx="14" ry="7" fill="#c99a62"/>
      <path d="M-11 -4 q11 -7 22 0" fill="none" stroke="#8f6338" stroke-width="2.5"/>
    </g>`);
  }
  const tasses = [];
  for(let i=0;i<Math.min(t.places,4);i++){
    const a = -Math.PI/2 + i * (2*Math.PI/Math.min(t.places,4)) + .4;
    const tx = cx + Math.cos(a)*rx*.55, ty = cy + Math.sin(a)*ry*.55;
    tasses.push(`<g transform="translate(${tx-6},${ty-10})">
      <ellipse cx="6" cy="11" rx="8" ry="2.6" fill="#cbac7d"/>
      <path d="M0 4 h12 l-1.5 7 h-9 Z" fill="#fdf4e0"/>
      <path class="vapeur" d="M6 2 c2 -3 -2 -4 0 -7" fill="none" stroke="#fff6e2" stroke-width="1.5" stroke-linecap="round"/>
    </g>`);
  }
  return `
  <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${chaises.join('')}
    <ellipse cx="${cx}" cy="${cy+30}" rx="${rx*0.9}" ry="${ry*0.6}" fill="rgba(94,67,45,.22)"/>
    <rect x="${cx-7}" y="${cy}" width="14" height="30" rx="5" fill="#8f6338"/>
    <ellipse cx="${cx}" cy="${cy+4}" rx="${rx}" ry="${ry}" fill="#a97745"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#c99a62"/>
    <ellipse cx="${cx}" cy="${cy-1}" rx="${rx*.84}" ry="${ry*.78}" fill="#d8a96f"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#8f6338" stroke-width="2" opacity=".6"/>
    <!-- petit vase -->
    <g transform="translate(${cx-5},${cy-22})">
      <path d="M0 10 h10 l-1.5 10 h-7 Z" fill="#bfe4e2"/>
      <path d="M5 10 c-1 -8 -5 -10 -7 -14 c5 1 8 4 9 9" fill="#6f9e59"/>
      <circle cx="7" cy="-2" r="3" fill="#e79a93"/><circle cx="2" cy="-4" r="2.4" fill="#f8e3a6"/>
    </g>
    ${tasses.join('')}
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="Caveat, cursive" font-size="17" fill="#7a5533" opacity=".85">${t.nom.replace('Table ','T')}</text>
  </svg>`;
}

function entite(cls, x, y, html, onClick, titre){
  const el = document.createElement('div');
  el.className = 'ent ' + cls + (onClick ? ' cliquable' : '');
  el.style.left = pc(x, W);
  el.style.top  = pc(y, H);
  el.style.zIndex = Math.round(y);
  el.innerHTML = html + (titre ? `<span class="etiquette">${titre}</span>` : '');
  if(onClick){
    el.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  }
  salon.appendChild(el);
  return el;
}

const siegesMonde = {};        // tableId -> [{x,y}]
TABLES.forEach(t => {
  const d = 54 + t.places*9, rx = d/2, ry = d/2*0.42;
  const el = entite('table', t.x, t.y + (d+70)/2, tableSVG(t), () => choisir('table', t.id), `${t.nom} · ${t.places} places`);
  el.dataset.table = t.id;
  // profondeur : on se base sur le centre du plateau, pas sur le bas du dessin,
  // pour que les clients assis « devant » passent bien par-dessus la table
  el.style.zIndex = Math.round(t.y);
  // position monde de chaque siège (pour y asseoir les clients)
  siegesMonde[t.id] = [];
  for(let i=0;i<t.places;i++){
    const a = -Math.PI/2 + i*(2*Math.PI/t.places);
    siegesMonde[t.id].push({
      x: t.x + Math.cos(a)*(rx+26),
      y: t.y + Math.sin(a)*(ry+20)
    });
  }
});

});

function dansObstacle(x,y){
  return OBSTACLES.some(o => x>o.x0 && x<o.x1 && y>o.y0 && y<o.y1);
}
function nouvelleCible(c){
  for(let essai=0; essai<24; essai++){
    let x, y;
    if(Math.random() < .42){                       // aller vers un coin douillet
      const s = SPOTS[(Math.random()*SPOTS.length)|0];
      x = s.x + (Math.random()*44-22); y = s.y + (Math.random()*22-11);
    }else{
      x = ZONE.x0 + Math.random()*(ZONE.x1-ZONE.x0);
      y = ZONE.y0 + Math.random()*(ZONE.y1-ZONE.y0);
    }
    if(!dansObstacle(x,y)){ c.tx = x; c.ty = y; return; }
  }
  c.tx = c.x; c.ty = c.y;
}
chatsVivants.forEach(nouvelleCible);

function dessinerChat(c){
  const etat = c.etat === 'marche' ? 'marche' : (c.etat === 'dort' ? 'dort' : 'assis');
  if(c.rendu !== etat){
    c.el.querySelector('.corps').innerHTML = chatSVG(c.data, etat);
    c.el.querySelector('.corps').className = 'corps' + (etat==='marche' ? ' marche' : '');
    c.rendu = etat;
  }
}

let dernier = performance.now();
function boucle(maintenant){
  const dt = Math.min((maintenant - dernier)/1000, .05);
  dernier = maintenant;

  chatsVivants.forEach(c => {
    if(c.etat === 'marche'){
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const dist = Math.hypot(dx,dy);
      if(dist < 4){
        const surSpot = SPOTS.some(s => Math.hypot(s.x-c.x, s.y-c.y) < 40);
        if(surSpot && Math.random() < .62){ c.etat='dort'; c.attente = 5000 + Math.random()*9000; }
        else { c.etat='assis'; c.attente = 900 + Math.random()*3200; }
      }else{
        if(Math.abs(dx) > 2) c.dir = dx > 0 ? 1 : -1;
        c.x += dx/dist * c.vitesse * dt;
        c.y += dy/dist * c.vitesse * dt;
      }
    }else{
      c.attente -= dt*1000;
      if(c.attente <= 0){ nouvelleCible(c); c.etat='marche'; }
    }
    dessinerChat(c);
    c.el.style.left = pc(c.x, W);
    c.el.style.top  = pc(c.y, H);
    c.el.style.zIndex = Math.round(c.y) + 8;
    c.el.querySelector('.corps').style.transform = `scale(${c.dir < 0 ? -.8 : .8}, .8)`;
  });

  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

/* ============================================================
   5. PANNEAU : fiches chat / employé / table + prise de commande
   ============================================================ */

const euro = n => n.toFixed(2).replace('.', ',') + ' €';
const placesTotal = TABLES.reduce((s,t)=>s+t.places,0);
const occupees = tableId => CLIENTS.filter(c=>c.tableId===tableId).length;

function choisir(type, id){
  selection = { type, id };
  if(type === 'employe'){
    const e = EMPLOYES.find(x=>x.id===id);
    brouillon = (e.role === 'Serveur' || e.role === 'Serveuse')
      ? { employeId:id, tableId:null, lignes:{} } : null;
  }else{
    brouillon = null;
  }
  majSurbrillance();
  rendrePanneau();
}

function majSurbrillance(){
  salon.querySelectorAll('.ent').forEach(el => el.classList.remove('actif'));
  if(!selection) return;
  if(selection.type === 'chat'){
    const c = chatsVivants.find(c=>c.data.id===selection.id);
    if(c) c.el.classList.add('actif');
  }else if(selection.type === 'employe'){
    const el = salon.querySelector(`.ent[data-employe="${selection.id}"]`);
    if(el) el.classList.add('actif');
  }else if(selection.type === 'table'){
    const el = salon.querySelector(`.ent[data-table="${selection.id}"]`);
    if(el) el.classList.add('actif');
  }
}

function rendrePanneau(){
  if(!selection){
    panneau.innerHTML = `
      <h2>Le salon</h2>
      <p class="sous">Choisis quelqu'un dans la salle.</p>
      <div class="vide">
        <span class="patte">🐾</span>
        Clique sur un <b>chat</b> pour voir sa fiche,<br>
        sur un <b>serveur</b> pour prendre une commande,<br>
        sur une <b>table</b> pour son occupation.
      </div>`;
    return;
  }
  if(selection.type === 'chat')    return ficheChat(CHATS.find(c=>c.id===selection.id));
  if(selection.type === 'employe') return ficheEmploye(EMPLOYES.find(e=>e.id===selection.id));
  if(selection.type === 'table')   return ficheTable(TABLES.find(t=>t.id===selection.id));
}

function ficheChat(c){
  panneau.innerHTML = `
    <h2>${c.nom}</h2>
    <p class="sous">${c.race} · ${c.sexe}</p>
    <div class="fiche-haut">
      <div class="portrait">${chatSVG(c,'assis')}</div>
      <div>
        <span class="badge ${c.adoptable ? '' : 'rouge'}">${c.adoptable ? 'Adoptable' : 'Résident'}</span>
        <dl class="infos" style="margin-top:8px">
          <dt>Âge</dt><dd>${c.age} ans</dd>
          <dt>Poids</dt><dd>${c.poids}</dd>
        </dl>
      </div>
    </div>
    <dl class="infos">
      <dt>Robe</dt><dd>${c.motif}</dd>
      <dt>Caractère</dt><dd style="font-weight:600">${c.caractere}</dd>
      <dt>Vaccins</dt><dd>À jour</dd>
      <dt>Stérilisé</dt><dd>Oui</dd>
    </dl>
    <div class="humeur">« ${c.consigne} »</div>
    ${c.adoptable ? `<button class="btn" id="btn-adopt">Demander un dossier d'adoption</button>` : ''}`;
  const b = document.getElementById('btn-adopt');
  if(b) b.addEventListener('click', ()=> toast(`Dossier d'adoption de ${c.nom} transmis à l'accueil`));
}

function ficheTable(t){
  const occ = CLIENTS.filter(c=>c.tableId===t.id);
  panneau.innerHTML = `
    <h2>${t.nom}</h2>
    <p class="sous">${t.theme}</p>
    <dl class="infos">
      <dt>Capacité</dt><dd>${t.places} places</dd>
      <dt>Occupées</dt><dd>${occ.length}</dd>
      <dt>Libres</dt><dd>${t.places - occ.length}</dd>
      <dt>État</dt><dd>${occ.length===0 ? 'Libre' : (occ.length===t.places ? 'Complète' : 'Partiellement occupée')}</dd>
    </dl>
    <div class="bloc">
      <h3>Clients à table</h3>
      ${occ.length ? occ.map(c=>`<div class="ligne"><span class="nom">${c.nom}</span><span class="prix">${c.boisson}</span></div>`).join('')
                   : `<p class="sous">Table vide, prête à être dressée.</p>`}
    </div>
    <div class="bloc">
      <h3>Commandes de la table</h3>
      ${commandes.filter(c=>c.tableId===t.id).length
        ? commandes.filter(c=>c.tableId===t.id).map(c=>`<div class="ligne"><span class="nom">${c.resume}</span><span class="prix">${euro(c.total)}</span></div>`).join('')
        : `<p class="sous">Aucune commande.</p>`}
    </div>`;
}

function ficheEmploye(e){
  const sert = e.role === 'Serveur' || e.role === 'Serveuse';
  const roleBadge = sert ? '' : (e.role === 'Barista' ? 'bleu' : 'rouge');
  let html = `
    <h2>${e.nom}</h2>
    <p class="sous">${e.role} · ${e.anciennete} dans la maison</p>
    <div class="fiche-haut">
      <div class="portrait">${personneSVG(e,{assis:true})}</div>
      <div>
        <span class="badge ${roleBadge}">${e.role}</span>
        <div class="humeur" style="margin-top:8px;font-size:16px">« ${e.note} »</div>
      </div>
    </div>`;

  if(!sert){
    html += `<div class="bloc"><h3>Info</h3><p class="sous">
      ${e.role === 'Barista' ? 'Prépare les boissons au comptoir. Les commandes lui arrivent par les serveurs.'
                             : 'S\'occupe des chats : repas, litières, temps de repos. Ne prend pas les commandes.'}
    </p></div>`;
    panneau.innerHTML = html;
    return;
  }

  // --- prise de commande ---
  const b = brouillon;
  const totaux = () => CARTE.flatMap(g=>g.items)
    .reduce((s,it)=> s + (b.lignes[it.id]||0) * it.prix, 0);
  const nbArticles = CARTE.flatMap(g=>g.items).reduce((s,it)=> s + (b.lignes[it.id]||0), 0);

  html += `
    <div class="bloc">
      <h3>1 · Table à servir</h3>
      <div class="choix-tables">
        ${TABLES.map(t=>`<button class="pastille ${b.tableId===t.id?'on':''}" data-t="${t.id}">
            ${t.nom.replace('Table ','T')} <small style="font-weight:600;opacity:.75">${occupees(t.id)}/${t.places}</small>
          </button>`).join('')}
      </div>
    </div>
    <div class="bloc">
      <h3>2 · Carte</h3>
      <div class="carte">
        ${CARTE.map(g=>`
          <p class="cat">${g.cat}</p>
          ${g.items.map(it=>`
            <div class="ligne">
              <span class="nom">${it.nom}</span>
              <span class="prix">${euro(it.prix)}</span>
              <span class="qte">
                <button data-m="${it.id}">−</button>
                <span>${b.lignes[it.id]||0}</span>
                <button data-p="${it.id}">+</button>
              </span>
            </div>`).join('')}
        `).join('')}
      </div>
      <div class="total"><span>${nbArticles} article${nbArticles>1?'s':''}</span><b>${euro(totaux())}</b></div>
      <button class="btn" id="envoyer" ${(!b.tableId || nbArticles===0) ? 'disabled' : ''}>
        ${!b.tableId ? 'Choisis une table' : (nbArticles===0 ? 'Carte vide' : `Envoyer à ${e.nom}`)}
      </button>
    </div>`;

  panneau.innerHTML = html;

  panneau.querySelectorAll('[data-t]').forEach(btn =>
    btn.addEventListener('click', ()=>{ b.tableId = +btn.dataset.t; rendrePanneau(); }));
  panneau.querySelectorAll('[data-p]').forEach(btn =>
    btn.addEventListener('click', ()=>{ const k=btn.dataset.p; b.lignes[k]=(b.lignes[k]||0)+1; rendrePanneau(); }));
  panneau.querySelectorAll('[data-m]').forEach(btn =>
    btn.addEventListener('click', ()=>{ const k=btn.dataset.m; b.lignes[k]=Math.max(0,(b.lignes[k]||0)-1); rendrePanneau(); }));

  const env = document.getElementById('envoyer');
  if(env) env.addEventListener('click', ()=> envoyerCommande(e));
}

function envoyerCommande(e){
  const b = brouillon;
  const items = CARTE.flatMap(g=>g.items).filter(it => b.lignes[it.id] > 0);
  const total = items.reduce((s,it)=> s + b.lignes[it.id]*it.prix, 0);
  const resume = items.map(it=> `${b.lignes[it.id]}× ${it.nom}`).join(', ');
  const cmd = {
    id: commandes.length + 1,
    tableId: b.tableId,
    employe: e.nom,
    resume, total,
    statut: 'préparation'
  };
  commandes.push(cmd);
  brouillon = { employeId:e.id, tableId:null, lignes:{} };
  rendrePanneau();
  rendreCommandes();
  majCompteurs();
  toast(`Commande ${TABLES.find(t=>t.id===cmd.tableId).nom} transmise au comptoir`);
  setTimeout(()=>{ cmd.statut = 'servie'; rendreCommandes(); majCompteurs(); }, 7000);
}

function rendreCommandes(){
  const z = document.getElementById('liste-cmd');
  if(!commandes.length){
    z.innerHTML = `<p class="vide2">Aucune commande. Clique sur un serveur pour en prendre une.</p>`;
    return;
  }
  z.innerHTML = commandes.slice().reverse().map(c=>`
    <div class="cmd">
      <span class="t">${TABLES.find(t=>t.id===c.tableId).nom.replace('Table ','T')}</span>
      <span class="d">${c.resume}<br><small style="opacity:.6">${c.employe} · ${euro(c.total)}</small></span>
      <span class="s ${c.statut==='servie'?'servie':''}">${c.statut}</span>
    </div>`).join('');
}

function majCompteurs(){
  document.getElementById('cpt-places').textContent = (placesTotal - CLIENTS.length) + '/' + placesTotal;
  document.getElementById('cpt-clients').textContent = CLIENTS.length;
  document.getElementById('cpt-chats').textContent = CHATS.length;
  document.getElementById('cpt-cmd').textContent = commandes.filter(c=>c.statut!=='servie').length;
}

let timerToast;
function toast(txt){
  const t = document.getElementById('toast');
  document.getElementById('toast-txt').textContent = txt;
  t.classList.add('on');
  clearTimeout(timerToast);
  timerToast = setTimeout(()=> t.classList.remove('on'), 3200);
}

salon.addEventListener('click', ()=>{ selection=null; brouillon=null; majSurbrillance(); rendrePanneau(); });

majCompteurs();
rendreCommandes();
rendrePanneau();
</script>

<!--
================================================================
 PORTAGE ANGULAR — découpage conseillé
================================================================
 Composants
  app-salon                 → <div class="salon">, orchestre le plan de salle
  app-decor                 → le SVG de fond (statique, presentational)
  app-table  [table]        → plateau + chaises, @Output select
  app-personnage [personne] → le SVG de personnage (client / employé)
  app-chat-sprite [chat]    → le SVG de chat + état (assis/marche/dort)
  app-fiche-chat  [chat]    → panneau d'info
  app-fiche-employe         → formulaire de commande (ReactiveForms)
  app-ardoise-commandes     → liste des commandes en cours

 Animation des chats
  Un CatMovementService (requestAnimationFrame ou interval + NgZone.runOutsideAngular)
  qui publie un signal/BehaviorSubject<CatPosition[]> ; le composant se lie
  avec [style.left.%] / [style.top.%] pour éviter les cycles de change detection.

 Modèle REST attendu du back Spring (JPA)
  GET    /api/tables                 → Table{ id, nom, nbPlaces, zone }
  GET    /api/tables/{id}/occupation  → places libres / clients assis
  GET    /api/chats                  → Chat{ id, nom, race, age, sexe, poids,
                                             robe, caractere, adoptable, consigne }
  GET    /api/employes               → Employe{ id, nom, role, anciennete }
  GET    /api/carte                  → CategorieCarte{ nom, articles[] }
  POST   /api/commandes              → { tableId, employeId, lignes:[{articleId, qte}] }
  PATCH  /api/commandes/{id}/statut  → EN_PREPARATION | SERVIE | PAYEE
  POST   /api/adoptions              → { chatId, clientId }

 Entités JPA : Table, Chaise(optionnel), Client, Employe, Chat, Article,
 Commande, LigneCommande, Adoption, Visite(ticket d'entrée horodaté).
================================================================
-->
