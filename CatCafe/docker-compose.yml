### Utiliser 192.168.1.31 sur pc fixe (hostname -I dans terminal pour retrouver)
services:

  # Serveur MySQL 8.4.7
  db: # Définition de la base de données en mysql 8.4.7 (à partir de l'image récupérée)
    image: mysql:8.4.7
    container_name: mysql84 # Container associé à l'image de mysql
    restart: unless-stopped

    # Variables d'environnement nécessaires à la connexion avec la bdd : les valeurs sont stockées et appelées depuis le fichier .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # Pour relier le port local au port de la base de données se trouvant dans le conteneur
    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    
    networks:
      - catcafe_network

    # Vérification de l'état du service
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Interface d'administration phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    restart: unless-stopped

    # On met une condition sur l'état du service de bdd (db)
    depends_on:
      db:
        condition: service_healthy

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M

    ports:
      - "8081:80"

    networks:
      - catcafe_network

# Volume pour stocker les données liées à la bdd 
volumes:
  mysql_data:

networks:
  catcafe_network:
    driver: bridge
